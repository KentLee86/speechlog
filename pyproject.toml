[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechlog"
dynamic = ["version"]
description = "Independent transcript queries, statistics, word counts, and exports"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KentLee86"}]
dependencies = []

[project.scripts]
speechlog = "speechlog.cli:main"

[dependency-groups]
dev = ["pytest>=8", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/speechlog/_version.py"
