[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechlog"
version = "0.1.0"
description = "Independent transcript queries, search, and exports"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KentLee86"}]
dependencies = []

[project.scripts]
speechlog = "speechlog.cli:main"

[dependency-groups]
dev = ["pytest>=8", "build"]
